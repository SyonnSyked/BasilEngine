<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1024 1024" preserveAspectRatio="xMidYMid meet">
  <title>BasilEditor circuit leaf icon</title>
  <desc>A geometric basil leaf constructed from electric-cyan circuit segments on a dark field.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091522"/>
      <stop offset="1" stop-color="#03080f"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2934"/>
      <stop offset="1" stop-color="#07151f"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="#03080f"/>
  <rect x="32" y="32" width="960" height="960" rx="190" fill="url(#field)"/>
  <path d="M512 128 L650 222 L736 356 L710 526 L626 686 L512 856 L398 686 L314 526 L288 356 L374 222 Z"
        fill="url(#leaf)" stroke="#00e6f2" stroke-width="42" stroke-linejoin="bevel"/>

