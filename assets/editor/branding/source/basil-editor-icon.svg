        fill="none" stroke="#00e6f2" stroke-width="38" stroke-linecap="square"/>
  <path d="M512 330 H430 L354 388"
        fill="none" stroke="#00e6f2" stroke-width="34" stroke-linejoin="bevel"/>
  <path d="M512 330 H594 L670 388"
        fill="none" stroke="#00e6f2" stroke-width="34" stroke-linejoin="bevel"/>
  <path d="M512 482 H404 L340 536"
        fill="none" stroke="#00e6f2" stroke-width="34" stroke-linejoin="bevel"/>
  <path d="M512 482 H620 L684 536"
        fill="none" stroke="#00e6f2" stroke-width="34" stroke-linejoin="bevel"/>
  <path d="M512 634 H438 L404 678"
        fill="none" stroke="#00e6f2" stroke-width="34" stroke-linejoin="bevel"/>
  <path d="M512 634 H586 L620 678"
        fill="none" stroke="#00e6f2" stroke-width="34" stroke-linejoin="bevel"/>

  <g fill="#7f4dd9" stroke="#bf9aff" stroke-width="10">
    <rect x="326" y="360" width="56" height="56" rx="8"/>
    <rect x="642" y="360" width="56" height="56" rx="8"/>
    <rect x="312" y="508" width="56" height="56" rx="8"/>
    <rect x="656" y="508" width="56" height="56" rx="8"/>
  </g>

  <rect x="476" y="180" width="72" height="72" rx="10" fill="#00e6f2"/>
